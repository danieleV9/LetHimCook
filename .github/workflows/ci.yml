name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una sola run per branch: un push nuovo annulla quella ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Build & unit test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('LetHimCook.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        id: test
        run: |
          set -o pipefail
          xcodebuild test \
            -project LetHimCook.xcodeproj \
            -scheme LetHimCook \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Code coverage
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: python3 .github/scripts/coverage_summary.py TestResults.xcresult

      - name: Check compiler warnings
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: python3 .github/scripts/check_warnings.py TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
